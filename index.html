<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명산 스탬프 투어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d4; --paper:#f7f1e6; --ink:#1a1712; --muted:#6a5e4c;
  --forest:#1e3a2a; --green:#2f5d46; --gold:#b58a3c; --red:#b23a2a;
  --line:#d3c4a8; --card:#fffaf1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#eadfc8;min-height:100vh}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora{position:absolute;filter:blur(30px);opacity:.4;border-radius:50%;animation:drift 20s ease-in-out infinite alternate}
.a1{width:70vw;height:40vh;left:-10vw;top:-8vh;background:linear-gradient(120deg,#cfe0c4,#ead7a0)}
.a2{width:60vw;height:36vh;right:-12vw;top:10vh;background:linear-gradient(200deg,#c5d4c0,#e8c9a0);animation-duration:26s}
@keyframes drift{to{transform:translate(6vw,3vh) scale(1.08)}}
.mist{position:absolute;left:-20%;width:140%;height:16vh;background:linear-gradient(90deg,transparent,#fff8,transparent);filter:blur(14px);animation:sweep 16s linear infinite;opacity:.45}
.m1{top:22%}.m2{top:55%;animation-duration:22s}
@keyframes sweep{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
#intro,#main{position:relative;z-index:1}
.intro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:linear-gradient(180deg,#15241c 0%,#2a4030 55%,#3d5340 100%)}
.intro-card{width:min(420px,100%);background:linear-gradient(180deg,#fffaf1,#f3e7d0);border:1px solid #e0cfab;border-radius:22px;padding:32px 24px 26px;text-align:center;box-shadow:0 30px 60px -24px #0008}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--forest);background:#efe3c8;border:1px solid #d8c49a;border-radius:999px;padding:5px 12px}
.intro h1{font-family:'Noto Serif KR',serif;font-size:28px;margin:12px 0 6px;color:var(--forest)}
.intro-lead{font-size:20px;font-weight:800;color:var(--forest);margin:0 0 6px}
.intro p{color:var(--muted);font-size:13.5px;line-height:1.7}
.stats3{display:flex;gap:8px;margin:16px 0}
.stat{flex:1;background:#fff8;border:1px solid #e0cfab;border-radius:12px;padding:10px 4px}
.stat b{display:block;font-family:'Noto Serif KR',serif;font-size:18px;color:var(--forest)}
.stat span{font-size:10px;color:var(--muted)}
.start{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3a6b4f,#234736);cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.top{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-family:'Noto Serif KR',serif;font-size:20px;margin:0;color:var(--forest)}
.top .sub{margin:4px 0 0;font-size:12px;color:var(--muted)}
.ring-num{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--forest);font-weight:900}
.searchrow{display:flex;gap:8px;margin:12px 0 8px}
.searchrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--card)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.region{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.region-head{display:flex;justify-content:space-between;padding:12px 14px;cursor:pointer;background:#f3ead8}
.region-name{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--forest)}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;padding:14px}
.region.open .grid{display:grid}
.stamp-btn{background:0;border:0;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.circle{width:58px;height:58px;border-radius:50%;border:1.5px dashed #b7a27d;background:radial-gradient(circle at 35% 30%,#fffdf8,#efe4cf);display:flex;align-items:center;justify-content:center;position:relative}
.circle.done{border:2.5px solid var(--red);background:radial-gradient(circle at 32% 28%,#f7d4cb,#c24a38 58%,#8e2d22);transform:rotate(-6deg);color:#f8e6d8;font-family:'Noto Serif KR',serif;font-weight:900;font-size:11px}
.circle.done.has-photo{background-size:cover;background-position:center}
.circle.done.has-photo span.mark{background:#6e1c1280;border-radius:50%;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.m-name{font-size:11.5px;font-weight:700;text-align:center;max-width:80px}
.m-elev{font-size:10px;color:var(--green);font-weight:700}
.m-date{font-size:9px;color:var(--red)}
.course-box{display:none;margin:0 12px 12px;padding:10px 12px;background:#f4ead6;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.region.open .course-box{display:block}
.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:#fffaf3ee;border:1px solid var(--line);border-radius:16px;display:flex;z-index:20;backdrop-filter:blur(8px)}
.nav button{flex:1;border:0;background:0;padding:10px 0 8px;font:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--forest)}
.view{display:none}.view.on{display:block}
.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kmap-box{position:relative;width:100%;margin-top:8px;border-radius:14px;overflow:hidden;background:#cfe6f5}
.kmap-box img.kmap{width:100%;height:auto;display:block}
.kmap-box .mdot{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px #0004;padding:0;z-index:2}
.kmap-box .mdot.done{background:#b23a2a;width:11px;height:11px;margin:-5px 0 0 -5px}
.kmap-box .mdot.todo{background:#8a7a5a;opacity:.55}
.kmap-legend{font-size:11px;color:var(--muted);margin-top:8px}
.map-svg{width:100%;height:auto;display:block}
.map-sea{fill:#d7e6ef}
.map-land{fill:#e7d7b8;stroke:#b79d6a;stroke-width:1.2}
.rshape{stroke:#8d7348;stroke-width:1;cursor:pointer;transition:fill .2s}
.rshape:hover{filter:brightness(1.08)}
.mdot{stroke:#fff;stroke-width:.6;cursor:pointer}
.mdot.todo{fill:#cbbb9a;opacity:.55}
.mdot.done{fill:#b23a2a}

.rchip{cursor:pointer}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.scard b{display:block;font-size:18px;font-family:'Noto Serif KR',serif;color:var(--forest)}
.ach{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px;align-items:center}
.ach.off{opacity:.42;filter:grayscale(.6)}
.ach i{font-style:normal;font-size:22px;width:36px;text-align:center}
.sheet-dim{position:fixed;inset:0;background:#0006;display:none;z-index:70}
.sheet-dim.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(460px,100%);background:linear-gradient(180deg,#fffaf1,#f3e7d0);border:1px solid #e0cfab;border-radius:20px 20px 0 0;padding:16px 16px calc(88px + env(safe-area-inset-bottom));z-index:80;transition:.3s;max-height:88vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0 0 4px;font-family:'Noto Serif KR',serif;color:var(--forest)}
.sheet-info{margin:10px 0;padding:10px 12px;background:#f4ead6;border:1px solid var(--line);border-radius:12px;font-size:12.5px;line-height:1.55;color:var(--ink)}
.sheet-info p{margin:0 0 6px}
.sheet-info p:last-child{margin:0}
.sheet-info b{color:var(--forest)}
.sheet-info .empty{color:var(--muted)}
.sheet img{width:100%;height:170px;object-fit:cover;border-radius:12px;display:none;border:1px solid var(--line)}
.sheet img.show{display:block}
.sheet input,.sheet textarea,.sheet select{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fff}
.sheet textarea{min-height:64px;resize:vertical}
.sbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sbtns button{flex:1;min-width:110px;border:1px solid var(--line);background:#fffaf1;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.sbtns .pri{background:linear-gradient(180deg,#3a6b4f,#234736);color:#fff;border-color:#234736}
.sbtns .danger{color:#fff;background:#b23a2a;border-color:#8a2a1e}
.note{text-align:center;font-size:11px;color:var(--muted);margin:12px 8px}
.bar{height:8px;background:#e6d9c0;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f5d46,#b58a3c)}
.cmp{margin-top:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.cmp .pct{color:var(--green);font-weight:800}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
button.reset{display:block;margin:16px auto 0;background:0;border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--muted)}

.login{margin-top:18px;text-align:left}
.login label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.login input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:inherit}
.login-btns{display:flex;gap:8px;margin-top:14px}
.login-btns button{flex:1}
.userlist{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.userchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.who{font-size:12px;color:var(--muted);margin-top:4px}


#boom{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.spark{position:fixed;left:0;top:0;font-size:22px;will-change:transform,opacity;pointer-events:none;z-index:121;text-shadow:0 3px 8px #0003}
.boom-flash{position:fixed;inset:0;pointer-events:none;z-index:119;opacity:0}
.boom-banner{position:fixed;left:50%;top:18%;transform:translate(-50%,-40px) scale(.6);font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(28px,8vw,52px);color:#fff;text-shadow:0 0 18px #c1543f,0 4px 0 #7a2418,0 10px 24px #0008;z-index:122;pointer-events:none;white-space:nowrap}
@keyframes shakewin{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-10px,6px) rotate(-1deg)}
  40%{transform:translate(12px,-8px) rotate(1.2deg)}
  60%{transform:translate(-8px,-4px) rotate(-.8deg)}
  80%{transform:translate(8px,7px) rotate(.6deg)}
}

</style>
</head>
<body>
<div id="boom"></div>
<div class="sky"><div class="aurora a1"></div><div class="aurora a2"></div><div class="mist m1"></div><div class="mist m2"></div></div>
<div id="intro" class="intro">
  <div class="intro-card">
    <span class="eyebrow">MOUNTAIN STAMP JOURNAL</span>
    <p class="intro-lead">오늘도 산 하나</p>
    <h1>명산 스탬프 투어</h1>
    <p>대한민국 149개 명산을 기록하세요.</p>
    <div class="stats3">
      <div class="stat"><b>149</b><span>🏔️ 명산</span></div>
      <div class="stat"><b>9</b><span>📍 권역</span></div>
      <div class="stat"><b>22</b><span>🥾 국립공원</span></div>
    </div>
    <div class="login">
      <label>이름</label>
      <input id="loginName" placeholder="예: 김은정" autocomplete="username">
      <label>비밀번호 (숫자 4자리)</label>
      <input id="loginPin" placeholder="••••" inputmode="numeric" maxlength="4" autocomplete="current-password">
      <div class="login-btns">
        <button class="start" id="loginBtn" style="margin-top:0">로그인</button>
        <button id="signupBtn">새 수첩</button>
      </div>
      <div class="userlist" id="userList"></div>
    </div>
  </div>
</div>
<div id="main" class="wrap" style="display:none">
  <header class="top">
    <div>
      <h1>명산 스탬프 투어</h1>
      <p class="sub" id="subline">전국 명산을 하나씩 밟아가는 등정 수첩</p>
      <p class="who" id="who"></p>
    </div>
    <div style="text-align:right">
      <div class="ring-num" id="ringPct">0%</div>
      <div class="sub" id="ringLabel">0 / 0</div>
    </div>
  </header>
  <div id="view-list" class="view on">
    <div class="searchrow"><input id="q" placeholder="🔍 산 이름 검색"></div>
    <div class="filters">
      <button class="on" data-f="all">전체</button>
      <button data-f="done">완등</button>
      <button data-f="todo">미완등</button>
      <button data-f="np">국립공원</button>
      <button data-f="kilo">1000m+</button>
    </div>
    <div id="listApp"></div>
    <p class="note">산 칸을 누르면 기록장이 열려요. 사진·메모·날씨·코스·시간을 남길 수 있습니다.</p>
  </div>
  <div id="view-map" class="view"><div id="mapApp"></div></div>
  <div id="view-stats" class="view"><div id="statsApp"></div></div>
  <div id="view-set" class="view"><div id="setApp"></div></div>
</div>
<nav class="nav" id="tabNav" style="display:none">
  <button class="on" data-v="list">목록</button>
  <button data-v="map">지도</button>
  <button data-v="stats">통계</button>
  <button data-v="set">설정</button>
</nav>
<div id="sheetDim" class="sheet-dim"></div>
<div id="sheet" class="sheet">
  <h3 id="sheetTitle">산</h3>
  <p class="sub" id="sheetSub"></p>
  <div class="sheet-info" id="sheetInfo"></div>
  <div class="sheet-info" id="sheetPeople" style="display:none"></div>
  <img id="sheetPhoto" alt="정상 사진">
  <input id="dateEdit" type="date">
  <select id="weather">
    <option value="">날씨 선택</option>
    <option>맑음</option><option>구름</option><option>흐림</option><option>비</option><option>눈</option><option>안개</option>
  </select>
  <input id="courseNote" placeholder="🥾 코스">
  <input id="hours" placeholder="⏱️ 걸린 시간 (예: 4시간 20분)">
  <textarea id="memo" placeholder="한줄 메모"></textarea>
  <div class="sbtns">
    <button class="pri" id="photoBtn">사진 올리기</button>
    <button id="photoClearBtn">사진 지우기</button>
    <button class="danger" id="unstampBtn">완등 취소</button>
    <button id="sheetClose">저장하고 닫기</button>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<script>
const REGIONS = [
  ["수도권", ["감악산","관악산","광교산","검단산","고려산","남한산","도봉산","마니산","명지산","백운산","북한산","불암산","서리산","수락산","수리산","소요산","용문산","운악산","유명산","연인산","천마산","청계산","축령산","화악산"]],
  ["강원", ["가리산","가리왕산","감악산","계방산","공작산","금대봉","대암산","덕항산","두타산","마대산","민둥산","석화산","명성산","선자령","방태산","백덕산","백운산","삼악산","설악산","오대산","오대산 노인봉","오봉산","용화산","점봉산","치악산","태백산","태화산","팔봉산","함백산"]],
  ["대전·세종·충남", ["가야산","광덕산","계룡산","대둔산","덕숭산","서대산","오서산","용봉산","진악산","칠갑산"]],
  ["충북", ["구병산","금수산","도락산","민주지산","소백산","속리산","월악산","천태산","청화산","칠보산","황정산","희양산"]],
  ["대구·경북", ["가야산","금오산","경주 남산","내연산","대야산","문수산","비슬산","성인봉","운문산","응봉산","일월산","조령산","주왕산","주흘산","청량산","토함산","팔공산","황악산","황장산"]],
  ["부산·울산·경남", ["가지산","계룡산","금산(남해)","금정산","남덕유산","남산제일봉","무학산","미륵산","신불산","연화산","재약산","지리산","통영 지리산","천성산","천주산","천황산","화왕산","황매산","황석산"]],
  ["전북", ["강천산","구봉산","내장산","덕유산","마이산","만행산","모악산","방장산","백암산","백운산","변산","선운산","신무산","운장산","지리산 바래봉","지리산 반야봉","장안산","적상산","천상데미"]],
  ["광주·전남", ["깃대봉","달마산","덕룡산","동악산","두륜산","무등산","병풍산","불갑산","백운산","영취산","월출산","조계산","제암산","천관산","추월산","축령산","팔영산"]],
  ["제주", ["한라산"]]
];

const PEAK_SVG = `<svg class="peak" width="26" height="20" viewBox="0 0 26 20"><path d="M1 19 L9 5 L13 11 L17 3 L25 19 Z" fill="none" stroke="#2f5d46" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

// 정상(봉우리) 고도(m) — 산림청 100대 명산 공식 자료 및 관련 공개 자료 기준.
const ELEV = {
  "수도권::감악산":675, "수도권::관악산":632, "수도권::검단산":657, "수도권::고려산":436,
  "수도권::광교산":582, "수도권::남한산":522, "수도권::도봉산":740, "수도권::마니산":472,

function withTimeout(p,ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("t")),ms))]); }
async function storageGet(key){
  if(typeof window.storage!=="undefined" && window.storage){
    try{ const r=await withTimeout(window.storage.get(key,false),2500); if(r && typeof r.value==="string") return r.value; }catch(e){}
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key,val){
  let ok=false;
  if(typeof window.storage!=="undefined" && window.storage){
    try{ const r=await withTimeout(window.storage.set(key,val,false),2500); if(r) ok=true; }catch(e){}
  }
  if(!ok){ try{ localStorage.setItem(key,val); ok=true; }catch(e){ ok=false; } }
  return ok;
}
let currentUser=null;
let users={};
function progressKey(id){ return "progress_"+(id||"guest"); }
const ROOT = {id:"root", name:"root", pin:"7391"};
function isRoot(){ return !!(currentUser && (currentUser.id==="root" || currentUser.name==="root")); }
let allBooks=[];
async function loadAllBooks(){
  allBooks=[];
  if(!isRoot()) return;
  for(const [id,u] of Object.entries(users||{})){
    if(!u || u.name==="root") continue;
    let st={};
    try{ const raw=await storageGet(progressKey(id)); if(raw) st=JSON.parse(raw);}catch(e){}
    allBooks.push({id:id,name:u.name,state:st});
  }
}
function whoDid(key){
  return allBooks.map(b=>{
    const s=b.state && b.state[key];
    return (s&&s.done) ? {name:b.name,id:b.id,rec:s} : null;
  }).filter(Boolean);
}
function mergedState(){
  const m={};
  allBooks.forEach(b=>{
    Object.keys(b.state||{}).forEach(k=>{
      const v=b.state[k];
      if(v&&v.done) m[k]=v;
    });
  });
  return m;
}

async function doSignup(){
  const name=(document.getElementById("loginName").value||"").trim();
  const pin=(document.getElementById("loginPin").value||"").trim();
  if(!name) return toast("이름을 적어 주세요.");
  if(name.toLowerCase()==="root") return toast("그 이름은 쓸 수 없어요.");
  if(!/^\d{4}$/.test(pin)) return toast("비밀번호는 숫자 4자리예요.");
  if(Object.values(users).some(u=>u.name===name)) return toast("같은 이름이 이미 있어요. 로그인해 주세요.");
  const id=uid();
  users[id]={name:name,pin:pin};
  if(Object.keys(users).length===1){
    const old=await storageGet("progress");
    if(old) await storageSet(progressKey(id), old);
  }
  await saveUsers();
  await enterUser({id:id,name:name});
}
async function doLogin(){
  const name=(document.getElementById("loginName").value||"").trim();
  const pin=(document.getElementById("loginPin").value||"").trim();
  if(!name) return toast("이름을 적어 주세요.");
  const hit=Object.entries(users).find(function(e){return e[1].name===name;});
  if(!hit) return toast("이름이 없어요. 새 수첩을 만들어 주세요.");
  if(hit[1].pin!==pin) return toast("비밀번호가 달라요.");
  await enterUser({id:hit[0], name:hit[1].name});
}

  currentUser=u;
  await storageSet("stamp_session", JSON.stringify(u));
  await loadState();
  if(isRoot()) await loadAllBooks();
  else allBooks=[];
  const who=document.getElementById("who");
  if(who) who.textContent=u.name==="root"?"루트 관리자 · 전체 수첩":u.name+" 님의 수첩";

}

function fanfare(){
  try{
    const ctx = fanfare._c || (fanfare._c = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==="suspended") ctx.resume();
    const now=ctx.currentTime;
    const blast=(f,t,dur,type,vol)=>{
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(f, now+t);
      g.gain.setValueAtTime(0, now+t);
      g.gain.linearRampToValueAtTime(vol||0.07, now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+t); o.stop(now+t+dur+0.02);
    };
    [392,392,392,523].forEach((f,i)=>blast(f,i*0.1,0.22,"square",0.055));
    [523,659,784,1046,1318,1568].forEach((f,i)=>blast(f,0.5+i*0.09,0.42,"triangle",0.09));
    blast(784,1.15,0.8,"triangle",0.06);
    blast(1175,1.15,0.8,"sawtooth",0.045);
    [1046,1318,1568].forEach((f,i)=>blast(f,2.0+i*0.12,0.5,"square",0.05));
    for(let i=0;i<18;i++) blast(180+Math.random()*1400, 0.15+i*0.09, 0.14, i%2?"square":"sawtooth", 0.028);
  }catch(e){}
}
function spray(n, delay){
  const root=document.body;
  const W=innerWidth, H=innerHeight;
  for(let i=0;i<n;i++){
    const el=document.createElement("div");
    el.className="spark";
    el.textContent=PARTY[Math.floor(Math.random()*PARTY.length)];
    el.style.fontSize=(18+Math.random()*44)+"px";
    const edge=i%5;
    let x0,y0;
    if(edge===0){ x0=Math.random()*W; y0=-50; }
    else if(edge===1){ x0=W+50; y0=Math.random()*H; }
    else if(edge===2){ x0=Math.random()*W; y0=H+50; }
    else if(edge===3){ x0=-50; y0=Math.random()*H; }
    else { x0=W/2+(Math.random()-0.5)*80; y0=H/2+(Math.random()-0.5)*80; }
    const x1=W*0.5+(Math.random()-0.5)*W*1.05;
    const y1=H*0.36+(Math.random()-0.5)*H*0.6;
    const x2=x1+(Math.random()-0.5)*320;
    const y2=y1+30+Math.random()*280;
    const rot=(Math.random()*1440-720);
    root.appendChild(el);
    el.animate([
      {transform:`translate(${x0}px,${y0}px) rotate(0deg) scale(.15)`, opacity:0},
      {transform:`translate(${x1}px,${y1}px) rotate(${rot/2}deg) scale(${1.2+Math.random()*0.8})`, opacity:1, offset:.22},
      {transform:`translate(${x2}px,${y2}px) rotate(${rot}deg) scale(.35)`, opacity:0}
    ],{duration:1600+Math.random()*1400,easing:"cubic-bezier(.12,.85,.22,1)",delay:(delay||0)+Math.random()*420}).onfinish=()=>el.remove();
  }
}

  }
}

function pickCheer(name){
  const msg = CHEERS[Math.floor(Math.random()*CHEERS.length)];
  return name ? `${name} 완등! ${msg}` : msg;
}
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#234736;color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;z-index:90;max-width:84%;text-align:center;line-height:1.45;box-shadow:0 8px 22px #0003"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,5200);
}
function todayStr(){ const d=new Date(); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }

function allMountains(){
  const arr=[];
  REGIONS.forEach(([r,list])=>list.forEach(n=>arr.push({region:r,name:n,key:keyFor(r,n)})));
  return arr;
}
function statsNow(){
  const all=allMountains();
  const src=isRoot()?mergedState():state;
  let done=0,sum=0,over1000=0,np=0;
  const byRegion={};
  REGIONS.forEach(([r])=>byRegion[r]=0);
  let last=null, lastDate="";
  all.forEach(m=>{
    const s=src[m.key];
    if(s&&s.done){
      done++;
      const ev=ELEV[m.key]||0;
      sum+=ev;
      if(ev>=1000) over1000++;
      if(COURSE[m.key]) np++;
      byRegion[m.region]++;
      if(!lastDate || (s.date||"")>=lastDate){ lastDate=s.date||""; last=m; }
    }
  });
  return {total:all.length,done,sum,over1000,np,byRegion,last,lastDate};
}

function passFilter(m){
  const s=state[m.key];
  const done=!!(s&&s.done);
  if(filter==="done" && !done) return false;
  if(filter==="todo" && done) return false;
  if(filter==="np" && !COURSE[m.key]) return false;
  if(filter==="kilo" && !(ELEV[m.key]>=1000)) return false;
  if(query){
    const q=query.replace(/\s/g,"");
    if(!(m.name+m.region+(PEAKS[m.key]||"")).replace(/\s/g,"").includes(q)) return false;
  }
  return true;
}

function renderList(){
  const app=document.getElementById("listApp");
  app.innerHTML="";
  REGIONS.forEach(([region,list],idx)=>{
    const items=list.map(n=>({region,name:n,key:keyFor(region,n)})).filter(passFilter);
    if(!items.length && (query||filter!=="all")) return;
    const doneCount=list.filter(n=>{
      const k=keyFor(region,n);
      return isRoot() ? whoDid(k).length>0 : !!(state[k]&&state[k].done);
    }).length;
    const sec=document.createElement("div");
    sec.className="region"+(idx===0 || query || filter!=="all" ? " open":"");
    sec.innerHTML=`<div class="region-head"><span class="region-name">${region}</span><span>${doneCount} / ${list.length} ▾</span></div>
      <div class="bar"><i style="width:${list.length?doneCount/list.length*100:0}%"></i></div>`;
    sec.querySelector(".region-head").onclick=()=>sec.classList.toggle("open");
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(m=>{
      const people=isRoot()?whoDid(m.key):[];
      const s=state[m.key]; const done=isRoot()?people.length>0:!!(s&&s.done); const photo=s&&s.photo;
      const mark=STAMP[m.key]||"완등";
      const btn=document.createElement("button"); btn.className="stamp-btn";
      btn.innerHTML=`<div class="circle ${done?"done":""} ${photo?"has-photo":""}">${done?`<span class="mark">${mark}</span>`:PEAK_SVG}</div>
        <span class="m-name">${m.name}</span>
        <span class="m-elev">${ELEV[m.key]?ELEV[m.key].toLocaleString()+"m":""}</span>
        ${isRoot()&&people.length?`<span class="m-elev">${people.map(p=>p.name).join(" · ")}</span>`:""}
        ${done?`<span class="m-date">${s.date||""}</span>`:""}`;
      if(photo) btn.querySelector(".circle").style.backgroundImage=`url(${photo})`;
      btn.onclick=async()=>{
        if(!isRoot() && !done){
          state[m.key]={done:true,date:todayStr()};
          await saveState(); renderAll();
          party(m.name); toast(pickCheer(m.name));
        }
        openSheet(m.region,m.name);
      };
      grid.appendChild(btn);
    });
    sec.appendChild(grid);
    const courses=list.filter(n=>COURSE[keyFor(region,n)]);
    if(courses.length){
      const box=document.createElement("div"); box.className="course-box";
      box.innerHTML=`<b>🥾 국립공원 대표 코스</b>`+courses.map(n=>{
        const k=keyFor(region,n); const food=FOOD[k];
        return `<div style="margin-top:4px"><b>${n}</b> — ${COURSE[k]}${food?`<br>🍽 ${food}`:""}</div>`;
      }).join("");
      sec.appendChild(box);
    }
    app.appendChild(sec);
  });
  if(!app.children.length) app.innerHTML='<p class="note">조건에 맞는 산이 없어요.</p>';
}

const PIN = {
  "제주::한라산":[40.1, 88.7],
  "대구·경북::성인봉":[78.8, 22.6],
  "수도권::고려산":[29.6, 24.2],
  "수도권::마니산":[29.0, 27.4]
};
function projPct(lat,lng,key){
  if(key && PIN[key]) return PIN[key];
  if(lng >= 130.3) return [78.8, 22.6];
  if(lat < 33.85) return [40.1, 88.7];
  const x = 33.5 + (lng - 126.15) / (129.48 - 126.15) * 40.5;
  const y = 9.2 + (38.62 - lat) / (38.62 - 34.29) * 66.5;
  return [x, y];
}

function renderMap(){
  const st=statsNow();
  const el=document.getElementById("mapApp");
  const regions=REGIONS.map(([r,list])=>{
    const d=st.byRegion[r]||0;
    return {r,d,t:list.length,pct:list.length?d/list.length:0};
  });
  const dots = allMountains().map(m=>{
    const ll=COORDS[m.key]; if(!ll) return "";
    const [x,y]=projPct(ll[0],ll[1],m.key);
    const done=!!(state[m.key]&&state[m.key].done);
    return `<button type="button" class="mdot ${done?"done":"todo"}" data-k="${m.key}" title="${m.name}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%"></button>`;
  }).join("");
  el.innerHTML=`<div class="map-wrap">
    <div style="display:flex;justify-content:space-between;align-items:end">
      <div><b>대한민국</b><div class="sub">${st.done} / ${st.total} 완등</div></div>
      <div class="ring-num">${Math.round(st.done/st.total*100)}%</div>
    </div>
    <div class="kmap-box">
      <img class="kmap" alt="대한민국 지도" src="${KOREA_MAP}">
      ${dots}
    </div>
    <p class="kmap-legend">빨간 점 = 완등 · 점 누르면 기록장 · 아래 권역을 누르면 목록</p>
    <div>${regions.map(x=>`<button type="button" class="rchip cmp" data-r="${x.r}" style="width:100%;text-align:left;background:none;border:0;border-top:1px dashed var(--line);padding:8px 0;cursor:pointer">${x.r} <b>${x.d} / ${x.t}</b></button>`).join("")}</div>
  </div>`;
  el.querySelectorAll(".rchip").forEach(g=>{
    g.onclick=()=>{
      query=""; filter="all";
      document.getElementById("q").value="";
      setView("list");
      document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("on", b.dataset.f==="all"));
      const name=g.dataset.r;
      setTimeout(()=>{
        const n=[...document.querySelectorAll(".region-name")].find(el=>el.textContent===name);
        if(n){ n.closest(".region")?.classList.add("open"); n.scrollIntoView({behavior:"smooth",block:"start"}); }
      },50);
    };
  });
  el.querySelectorAll(".mdot").forEach(c=>{
    c.onclick=ev=>{
      ev.stopPropagation();
      const k=c.getAttribute("data-k");
      const [r,...rest]=k.split("::");
      openSheet(r, rest.join("::"));
    };
  });
}

function renderStats(){
  const st=statsNow();
  const pct=(st.done/st.total*100).toFixed(1);
  const maxR=Object.entries(st.byRegion).sort((a,b)=>b[1]-a[1])[0];
  const doneMs=allMountains().filter(m=>state[m.key]&&state[m.key].done);
  const maxH=doneMs.reduce((a,m)=>Math.max(a,ELEV[m.key]||0),0);
  const rec=recommend();
  const family = isRoot() ? allBooks.map(b=>{
    const n=Object.values(b.state||{}).filter(s=>s&&s.done).length;
    return `<div class="scard">👤 <b>${b.name}</b> · ${n} / 149</div>`;
  }).join("") : "";
  document.getElementById("statsApp").innerHTML=`
    ${family}
    <div class="statgrid">
      <div class="scard"><span>완등</span><b>${st.done} / ${st.total}</b><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="scard"><span>완등률</span><b>${pct}%</b></div>
      <div class="scard"><span>누적 고도</span><b>${st.sum.toLocaleString()}m</b></div>
      <div class="scard"><span>최고 고도</span><b>${maxH?maxH.toLocaleString()+"m":"-"}</b></div>

function recommend(){
  const todo=allMountains().filter(m=>!(state[m.key]&&state[m.key].done));
  if(!todo.length) return `<div>모든 명산을 완등했어요.</div>`;
  const st=statsNow();
  let pick;
  if(st.over1000<5) pick=todo.filter(m=>(ELEV[m.key]||0)>=1000 && (ELEV[m.key]||0)<1300)[0];
  if(!pick) pick=todo.filter(m=>COURSE[m.key])[0];
  if(!pick) pick=todo.slice().sort((a,b)=>(ELEV[b.key]||0)-(ELEV[a.key]||0))[0];
  return `<div style="margin-top:6px"><b>${pick.name}</b> · ${(ELEV[pick.key]||0).toLocaleString()}m · ${pick.region}<div style="font-size:12px;color:var(--muted);margin-top:4px">${(ELEV[pick.key]||0)>=1000?"이번엔 1000m에 도전해볼까요?":"아직 안 오른 명산이에요."}</div></div>`;
}

function setGistToken(v){ try{ localStorage.setItem("stamp_gh",(v||"").trim()); }catch(e){} }
function parseGistId(v){
  v=(v||"").trim();
  const m=v.match(/gist\.github\.com\/(?:[^/]+\/)?([a-fA-F0-9]+)/) || v.match(/^([a-fA-F0-9]{8,})$/);
  return m?m[1]:v.replace(/.*\//,"");
}
function apiSync(){
  let u=syncUrl().replace(/\/$/,"");
  if(!u) return "";
  if(!/\/sync$/.test(u)) u+="/sync";
  return u;
}

function newFamilyCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s=""; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  setFamilyToken(s); return s;
}
function stripPhotos(state, keep){
  if(keep) return state;
  const o={};
  Object.keys(state||{}).forEach(k=>{
    const v=Object.assign({}, state[k]||{});
    delete v.photo;
    o[k]=v;
  });
  return o;
}
async function collectBooks(withPhoto){
  const books={};
  if(isRoot()){
    for(const [id,u] of Object.entries(users)){
      if(!u || u.name==="root") continue;
      let st={};
      try{ const raw=await storageGet(progressKey(id)); if(raw) st=JSON.parse(raw);}catch(e){}
      books[u.name]={pin:u.pin,state:stripPhotos(st,withPhoto),updated:Date.now()};
    }
  }else if(currentUser && currentUser.name!=="root"){
    const u=users[currentUser.id]||{};
    books[currentUser.name]={pin:u.pin,state:stripPhotos(state,withPhoto),updated:Date.now()};
  }
  return books;
}

function countDone(st){
  return Object.values(st||{}).filter(s=>s&&s.done).length;
}
function sumElev(st){
  let n=0;
  Object.keys(st||{}).forEach(k=>{ if(st[k]&&st[k].done) n+=ELEV[k]||0; });
  return n;
}
function saveRankBoard(rows){
  try{ localStorage.setItem("stamp_rank", JSON.stringify({at:Date.now(),rows:rows})); }catch(e){}
}
function loadRankBoard(){
  try{ const o=JSON.parse(localStorage.getItem("stamp_rank")||"null"); return o&&o.rows?o:null; }catch(e){ return null; }
}
function buildRankFromBooks(books){
  const rows=[];
  Object.keys(books||{}).forEach(name=>{
    if(name==="root") return;
    const st=(books[name]&&books[name].state)||{};
    rows.push({name:name,done:countDone(st),sum:sumElev(st)});
  });
  if(currentUser && currentUser.name!=="root"){
    if(!rows.some(r=>r.name===currentUser.name)){
      rows.push({name:currentUser.name,done:countDone(state),sum:sumElev(state)});
    }else{
      rows.forEach(r=>{
        if(r.name===currentUser.name){ r.done=Math.max(r.done,countDone(state)); r.sum=Math.max(r.sum,sumElev(state)); }
      });
    }
  }
  rows.sort((a,b)=> b.done-a.done || b.sum-a.sum || a.name.localeCompare(b.name,"ko"));
  return rows;
}
function rankHtml(){
  let rows=[];
  if(isRoot() && allBooks && allBooks.length){
    rows=allBooks.map(b=>({name:b.name,done:countDone(b.state),sum:sumElev(b.state)}));
    rows.sort((a,b)=> b.done-a.done || b.sum-a.sum || a.name.localeCompare(b.name,"ko"));
    saveRankBoard(rows);
  }else{
    const board=loadRankBoard();
    rows=board?board.rows.slice():[];
    if(currentUser && currentUser.name!=="root"){
      const mine={name:currentUser.name,done:countDone(state),sum:sumElev(state)};
      const i=rows.findIndex(r=>r.name===mine.name);
      if(i>=0) rows[i]=mine; else rows.push(mine);
      rows.sort((a,b)=> b.done-a.done || b.sum-a.sum || a.name.localeCompare(b.name,"ko"));
    }
  }
  if(!rows.length){
    return `<div class="scard" style="margin-bottom:12px"><b>가족 랭킹</b><div style="font-size:12px;color:var(--muted);margin-top:6px">서버에서 받아오면 순위가 생깁니다. 설정 → 다른 폰에서 받기</div></div>`;
  }
  const medal=["🥇","🥈","🥉"];
  const me=currentUser&&currentUser.name;
  return `<div class="scard" style="margin-bottom:12px"><b>가족 랭킹</b><div style="margin-top:8px">${rows.map((r,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;${r.name===me?"font-weight:700":""}"><span>${medal[i]||(i+1)+"."} ${r.name}</span><span>${r.done}좌 · ${r.sum.toLocaleString()}m</span></div>`).join("")}</div><div style="font-size:11px;color:var(--muted);margin-top:8px">완등 수 → 누적 고도 순 · 서버에서 받은 기록 기준</div></div>`;
}
async function applyBooks(remote){
  const books=(remote&&remote.books)||{};
  let n=0;
  for(const name of Object.keys(books)){
    if(name==="root") continue;
    const incoming=books[name];
    let id=Object.keys(users).find(k=>users[k].name===name);
    if(!id){
      id=uid();
      users[id]={name:name,pin:incoming.pin||"0000"};
    }
    let local={};
    try{ const raw=await storageGet(progressKey(id)); if(raw) local=JSON.parse(raw);}catch(e){}
    const st=Object.assign({}, local);
    Object.keys(incoming.state||{}).forEach(k=>{
      const nv=incoming.state[k], ov=st[k];
      if(nv && nv.done){
        if(!ov || !ov.done || String(nv.date||"")>=String(ov.date||"")){
          st[k]=Object.assign({}, ov||{}, nv);
          if(!nv.photo && ov && ov.photo) st[k].photo=ov.photo;
        }
      }
    });
    await storageSet(progressKey(id), JSON.stringify(st));
    n++;
  }
  await saveUsers();
  if(currentUser && !isRoot()){
    await loadState();
  }else if(isRoot()){
    await loadAllBooks();
  }
  renderAll();
  return n;
}
async function syncPush(){
  const fam=familyToken();
  const gh=gistToken();
  if(!gh) return toast("GitHub 토큰을 먼저 넣으세요.");
  if(!fam) return toast("가족 코드를 먼저 만드세요.");
  const withPhoto=!!(document.getElementById("syncPhoto")&&document.getElementById("syncPhoto").checked);
  toast("올리는 중…");
  try{
    const payload={v:2,token:fam,books:await collectBooks(withPhoto),from:(currentUser&&currentUser.name)||""};
    const id=parseGistId(gistId());
    const body={description:"myungsan-stamp",public:false,files:{"myungsan.json":{content:JSON.stringify(payload)}}};
    const headers={"Authorization":"Bearer "+gh,"Accept":"application/vnd.github+json","Content-Type":"application/json"};
    const res=await fetch(id?("https://api.github.com/gists/"+id):"https://api.github.com/gists",{method:id?"PATCH":"POST",headers:headers,body:JSON.stringify(body)});
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||("HTTP "+res.status));
    if(data.id){ setGistId(data.id); const el=document.getElementById("gistId"); if(el) el.value=data.id; }
    toast("GitHub Gist에 올렸습니다.");
  }catch(e){ toast("올리기 실패. gist 권한 토큰인지 확인하세요."); }
}
async function syncPull(){
  const fam=familyToken();
  const gh=gistToken();
  const id=parseGistId(gistId());
  if(!id) return toast("Gist ID를 먼저 넣으세요.");
  toast("받아오는 중…");

    const headers={"Accept":"application/vnd.github+json"};
    if(gh) headers["Authorization"]="Bearer "+gh;
    const res=await fetch("https://api.github.com/gists/"+id,{headers:headers});
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||("HTTP "+res.status));
    const file=(data.files||{})["myungsan.json"] || Object.values(data.files||{})[0];
    let raw=file && (file.content||"");
    if(!raw && file && file.raw_url){ const r=await fetch(file.raw_url); raw=await r.text(); }
    const payload=JSON.parse(raw);
    if(payload.token && fam && payload.token.toUpperCase()!==fam.toUpperCase()) return toast("가족 코드가 달라요.");
    const n=await applyBooks(payload);
    toast(n+"명 수첩을 받아왔습니다.");
  }catch(e){ toast("받아오기 실패. Gist ID와 토큰을 확인하세요."); }
}
const GAS_CODE = `function doGet(e){
  const f=file_();
  return ContentService.createTextOutput(f.getBlob().getDataAsString()||"{}").setMimeType(ContentService.MimeType.JSON);
}
function doPost(e){
  const incoming=JSON.parse(e.postData.contents);
  const f=file_();
  let prev={};
  try{ prev=JSON.parse(f.getBlob().getDataAsString()||"{}"); }catch(err){ prev={}; }
  if(prev.token && incoming.token && prev.token!==incoming.token){
    return ContentService.createTextOutput(JSON.stringify({ok:false,error:"token"})).setMimeType(ContentService.MimeType.JSON);
  }
  const books=Object.assign({}, prev.books||{});
  Object.keys(incoming.books||{}).forEach(function(name){
    const a=books[name]||{state:{}};
    const b=incoming.books[name]||{state:{}};
    const st=Object.assign({}, a.state||{});
    Object.keys(b.state||{}).forEach(function(k){
      const nv=b.state[k], ov=st[k];
      if(!ov || (nv && nv.done && (!ov.done || String(nv.date||"")>=String(ov.date||"")))) st[k]=nv;
    });
    books[name]={pin:b.pin||a.pin,state:st,updated:Date.now()};
  });
  const out={v:2,token:incoming.token||prev.token,books:books,updated:Date.now()};
  f.setContent(JSON.stringify(out));
  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
}
function file_(){
  const name="myungsan-family.json";
  const it=DriveApp.getFilesByName(name);
  if(it.hasNext()) return it.next();
  return DriveApp.createFile(name, "{}", MimeType.PLAIN_TEXT);
}`;

    }
  }
  const savedMail=localStorage.getItem("stamp_dev_mail")||"";
  document.getElementById("devMail").value=savedMail;
  document.getElementById("devMail").onchange=e=>localStorage.setItem("stamp_dev_mail", e.target.value.trim());
  document.getElementById("btnReq").onclick=()=>{
    const mail="gime41333@gmail.com";
    const body=(document.getElementById("reqBody").value||"").trim();
    if(!body) return toast("요청 내용을 적어 주세요.");
    const who=currentUser&&currentUser.name?currentUser.name:"익명";
    const sub="[명산 스탬프] 요청사항 - "+who;
    const text="보낸 사람: "+who+"\n\n"+body+"\n";
    location.href="mailto:"+mail+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(text);
  };
}

function updateHeader(){
  const st=statsNow();
  const pct=st.total?Math.round(st.done/st.total*100):0;
  document.getElementById("ringPct").textContent=pct+"%";
  document.getElementById("ringLabel").textContent=`${st.done} / ${st.total}`;
  document.getElementById("subline").textContent = st.done===0 ? "전국 명산을 하나씩 밟아가는 등정 수첩" : "다음 산은 어디로 가볼까?";
}

function renderAll(){
  updateHeader();
  renderList();
  if(view==="map") renderMap();
  if(view==="stats") renderStats();
  if(view==="set") renderSettings();
}

function setView(v){
  view=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("on", el.id==="view-"+v));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if(v==="map") renderMap();
  if(v==="stats") renderStats();
  if(v==="set") renderSettings();
}

function openSheet(region,name){
  sheetKey=keyFor(region,name);
  const s=state[sheetKey]||{};
  document.getElementById("sheetTitle").textContent=name;
  document.getElementById("sheetSub").textContent=`${region} · ${(ELEV[sheetKey]||0).toLocaleString()}m`;
  const peaks=PEAKS[sheetKey];
  const course=COURSE[sheetKey];
  const food=FOOD[sheetKey];
  document.getElementById("sheetInfo").innerHTML =
    `<p><b>봉우리</b><br>${peaks || '<span class="empty">등록된 세부 봉우리가 없어요</span>'}</p>`+
    `<p><b>대표 탐방코스</b><br>${course || '<span class="empty">국립공원 대표 코스 정보가 없어요</span>'}</p>`+
    `<p><b>근처 맛집</b><br>${food || '<span class="empty">등록된 맛집 정보가 없어요</span>'}</p>`;
  const peopleBox=document.getElementById("sheetPeople");
  const editables=["sheetPhoto","dateEdit","weather","courseNote","hours","memo","photoBtn","photoClearBtn","unstampBtn","sheetClose"];
  if(isRoot()){
    const people=whoDid(sheetKey);
    peopleBox.style.display="block";
    peopleBox.innerHTML = people.length
      ? `<p><b>누가 완등했는지</b></p>`+people.map(p=>{
          const r=p.rec||{};
          return `<p>👤 <b>${p.name}</b><br>${r.date||""} ${r.weather||""} ${r.hours||""}<br>${r.courseNote||""}<br>${r.memo||""}${r.photo?`<br><img src="${r.photo}" style="width:100%;border-radius:10px;margin-top:6px">`:""}</p>`;
        }).join("")
      : `<p class="empty">아직 이 산을 완등한 사람이 없습니다.</p>`;
    editables.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display="none"; });
    const close=document.getElementById("sheetClose");
    if(close){ close.style.display=""; close.textContent="닫기"; }
  }else{
    peopleBox.style.display="none"; peopleBox.innerHTML="";
    editables.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display=""; });
    const close=document.getElementById("sheetClose");
    if(close) close.textContent="저장하고 닫기";
  }
  const img=document.getElementById("sheetPhoto");
  if(s.photo){ img.src=s.photo; img.classList.add("show"); } else { img.removeAttribute("src"); img.classList.remove("show"); }
  document.getElementById("memo").value=s.memo||"";
  document.getElementById("weather").value=s.weather||"";
  document.getElementById("courseNote").value=s.courseNote||COURSE[sheetKey]||"";
  document.getElementById("hours").value=s.hours||"";
  document.getElementById("dateEdit").value=(s.date||todayStr()).replace(/\./g,"-");
  document.getElementById("sheetDim").classList.add("on");
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){ document.getElementById("sheetDim").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); sheetKey=null; }

async function saveSheetMeta(){
  if(!sheetKey) return;
  if(!state[sheetKey] || !state[sheetKey].done) return;
  const d=document.getElementById("dateEdit").value;
  state[sheetKey].date = d ? d.replace(/-/g,".") : todayStr();
  state[sheetKey].memo=document.getElementById("memo").value.trim();
  state[sheetKey].weather=document.getElementById("weather").value;
  state[sheetKey].courseNote=document.getElementById("courseNote").value.trim();
  state[sheetKey].hours=document.getElementById("hours").value.trim();
  await saveState(); renderAll();
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=reject;
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=720; let w=img.width,h=img.height; if(w>max){h=Math.round(h*max/w);w=max;}
        const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.62));
      };
      img.onerror=reject; img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

function showMain(){
  document.getElementById("intro").style.display="none";
  document.getElementById("main").style.display="block";
  document.getElementById("tabNav").style.display="flex";
}

function bind(){
  document.getElementById("loginBtn").onclick=doLogin;
  document.getElementById("signupBtn").onclick=doSignup;
  document.getElementById("loginPin").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  document.getElementById("loginName").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("loginPin").focus(); });
  document.getElementById("q").oninput=e=>{ query=e.target.value.trim(); renderList(); };
  document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
    filter=b.dataset.f; document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b)); renderList();
  });
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
  document.getElementById("sheetDim").onclick=async()=>{ await saveSheetMeta(); closeSheet(); };
  document.getElementById("sheetClose").onclick=async()=>{ await saveSheetMeta(); closeSheet(); };
  document.getElementById("photoBtn").onclick=()=>document.getElementById("photoInput").click();
  document.getElementById("photoClearBtn").onclick=async()=>{ if(!sheetKey||!state[sheetKey])return; delete state[sheetKey].photo; await saveState(); renderAll(); openSheet(...sheetKey.split("::")); };
  document.getElementById("unstampBtn").onclick=async (ev)=>{
    ev.preventDefault(); ev.stopPropagation();
    const k = sheetKey;
    if(!k) return;
    delete state[k];
    sheetKey = null;
    document.getElementById("sheetDim").classList.remove("on");
    document.getElementById("sheet").classList.remove("on");
    await saveState();
    renderAll();
    toast("완등을 취소했어요.");
  };
  document.getElementById("photoInput").onchange=async e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value="";
    if(!file||!sheetKey) return;
    try{
      const data=await compressImage(file);
      if(!state[sheetKey]) state[sheetKey]={done:true,date:todayStr()};
      state[sheetKey].photo=data;
      const ok=await saveState();
      if(!ok){ delete state[sheetKey].photo; toast("사진이 너무 커서 저장하지 못했어요."); }
      renderAll(); openSheet(...sheetKey.split("::"));
    }catch(err){ toast("사진을 불러오지 못했어요."); }
  };
}

(async function init(){
  await loadUsers();
  bind();
  renderUserList();
  try{
    const raw=await storageGet("stamp_session");
    if(raw){
      const u=JSON.parse(raw);
      if(u && u.id && users[u.id]){
        currentUser=u;
        await loadState();
        if(isRoot()) await loadAllBooks();
        const who=document.getElementById("who");
        if(who) who.textContent=u.name==="root"?"루트 관리자 · 전체 수첩":u.name+" 님의 수첩";
        showMain();
        renderAll();
        return;
      }
    }
  }catch(e){}
  renderAll();
})();

</script>
